# Builds Lumen.app for Apple Silicon and Intel Macs and publishes a GitHub release.
# Runs when a version tag like v0.1.0 is pushed, or by hand from the Actions tab.
name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: apple-silicon
          - runner: macos-15-intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      - name: Build Lumen.app
        run: ./build_mac_app.sh

      - name: Check the built app starts
        run: |
          export LUMEN_DATA_DIR="$RUNNER_TEMP/lumen-data"
          dist/Lumen.app/Contents/MacOS/Lumen --version
          dist/Lumen.app/Contents/MacOS/Lumen --no-open --port 8799 &
          APP=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8799/ >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8799/ | grep -q "LUMEN_TOKEN"
          curl -sf -o /dev/null http://127.0.0.1:8799/static/js/app.js
          TOKEN=$(curl -sf http://127.0.0.1:8799/ | sed -n 's/.*LUMEN_TOKEN = "\([^"]*\)".*/\1/p')
          curl -sf -H "X-Lumen-Token: $TOKEN" http://127.0.0.1:8799/api/boot | grep -q '"ok": true'
          kill $APP

      - name: Zip the app
        run: ditto -c -k --keepParent dist/Lumen.app "Lumen-macOS-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-macOS-${{ matrix.arch }}
          path: Lumen-macOS-${{ matrix.arch }}.zip

  release:
    needs: build-mac
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Lumen ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md
